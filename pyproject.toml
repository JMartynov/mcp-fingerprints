[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-fingerprints"
version = "1.0.0"
description = "Open-Source MCP Server Passport & Tool Signature Knowledge Base"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MCP Fingerprints Contributors"}]
license = {text = "MIT"}
keywords = ["mcp", "model-context-protocol", "security", "fingerprints", "ai-agents", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pyyaml",
]
semantic = [
    "fastembed>=0.3.0",
]

[project.urls]
Homepage = "https://jmartynov.github.io/mcp-fingerprints/"
Repository = "https://github.com/JMartynov/mcp-fingerprints"
Issues = "https://github.com/JMartynov/mcp-fingerprints/issues"

[project.scripts]
mcp-fingerprints = "mcp_fingerprints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: mark test as live/web integration test",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
    "tomli>=2.4.1",
]
