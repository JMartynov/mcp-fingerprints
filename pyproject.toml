[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-fingerprints"
version = "1.0.0"
description = "Open-Source MCP Server Passport & Tool Signature Knowledge Base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
mcp-fingerprints = "mcp_fingerprints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
