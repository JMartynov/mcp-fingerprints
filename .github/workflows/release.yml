name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build wheels and sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.whl' -print -quit)" || (echo "No wheel found" && exit 1)
          test -n "$(find dist -name '*.tar.gz' -print -quit)" || (echo "No sdist found" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-fingerprints
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign artifacts with Cosign
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          # Also sign passports.json.gz if available
          if [ -f data/passports.json.gz ]; then
             cosign sign-blob --yes --bundle "data/passports.json.gz.sigstore.json" "data/passports.json.gz"
          fi
          # Note: Attaching to GitHub Release could be done with `gh release upload` if a release event triggers it
          if [ "${{ github.event_name }}" == "release" ]; then
             gh release upload ${{ github.event.release.tag_name }} dist/*.sigstore.json data/passports.json.gz.sigstore.json || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
