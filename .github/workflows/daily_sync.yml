name: Daily MCP Fingerprint & Passport Sync

on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force version bump and release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  sync-mcp-passports:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.commit_push.outputs.release_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preserve Baseline Snapshot for Delta & Drift
        run: |
          if [ -f "passports.json.gz" ]; then
            cp passports.json.gz previous_passports.json.gz
            echo "Preserved baseline passports.json.gz to previous_passports.json.gz"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Multi-Source Passport Synchronizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m mcp_fingerprints.cli sync --all --enrich-ast --report
          python -c "import sys; from mcp_fingerprints.reporter import generate_ecosystem_report, format_markdown_report; print(format_markdown_report(generate_ecosystem_report('data/fingerprints')))" > $GITHUB_STEP_SUMMARY

      - name: Validate All Passports Against Schema Invariants
        run: |
          python -m mcp_fingerprints.cli validate --dir data/fingerprints
          PYTHONPATH=src python scripts/validate_passports.py

      - name: Run Test Suite
        run: |
          PYTHONPATH=src python -m pytest -v

      - name: Compile Consolidated Snapshot & Web Catalog
        env:
          SECURITY_WEBHOOK_URL: ${{ secrets.SECURITY_WEBHOOK_URL }}
        run: |
          # Compile new snapshot
          python -m mcp_fingerprints.snapshot data/fingerprints passports.json.gz

          # Run drift detection if previous snapshot existed
          if [ -f "previous_passports.json.gz" ]; then
            python -m mcp_fingerprints.cli detect-drift --old previous_passports.json.gz --new data/fingerprints --output drift_report.json
            echo "## Supply-Chain Drift & Tamper Report" >> $GITHUB_STEP_SUMMARY
            cat drift_report.json >> $GITHUB_STEP_SUMMARY
          fi

          PYTHONPATH=src python scripts/sync_embeddings.py
          PYTHONPATH=src:. python scripts/generate_web_catalog.py

      - name: Commit and push updated passports & snapshot
        id: commit_push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes in data/fingerprints/
          FINGERPRINT_CHANGES=$(git status --porcelain data/fingerprints/ | grep -v "sync_state.json" | grep -v "index.json" | grep -v ".passport_index.pickle" || true)
          
          git add data/fingerprints/ passports.json.gz web/catalog.json
          [ -f data/embeddings.npz ] && git add data/embeddings.npz data/.embeddings_hash || true
          
          if ! git diff --staged --quiet || [ "${{ inputs.force_release }}" = "true" ]; then
            if [ -n "$FINGERPRINT_CHANGES" ] || [ "${{ inputs.force_release }}" = "true" ]; then
              # Bump version
              NEW_VERSION=$(python scripts/bump_version.py --dry-run)
              python scripts/bump_version.py --apply
              PYTHONPATH=src:. python scripts/generate_web_catalog.py
              python scripts/generate_sync_updates.py --old previous_passports.json.gz --new passports.json.gz --version "${NEW_VERSION}"
              git add pyproject.toml src/mcp_fingerprints/__init__.py web/catalog.json web/sw.js web/updates/
              git commit -m "chore(release): bump version to v${NEW_VERSION} and sync MCP fingerprints"
              git tag "v${NEW_VERSION}"
              echo "release_created=true" >> "$GITHUB_OUTPUT"
              echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            else
              git commit -m "chore(fingerprints): automated daily sync of MCP passports and snapshot [skip ci]"
              echo "release_created=false" >> "$GITHUB_OUTPUT"
            fi
            
            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin main --tags; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed. Retrying in $((i * 5))s..."
              sleep $((i * 5))
              git pull --rebase origin main || true
            done
            if [ "$pushed" = false ]; then
              echo "Failed to push after multiple attempts"
              exit 1
            fi
            
            if [ -n "$FINGERPRINT_CHANGES" ] || [ "${{ inputs.force_release }}" = "true" ]; then
              gh release create "v${NEW_VERSION}" passports.json.gz --title "v${NEW_VERSION}: Automated Fingerprint Sync Release" --generate-notes
              gh workflow run release.yml --ref "v${NEW_VERSION}" || true
            fi
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Downstream mcp-vulnerabilities Sync
        if: steps.commit_push.outputs.release_created == 'true'
        env:
          TRIGGER_TOKEN: ${{ secrets.REPO_DISPATCH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TRIGGER_TOKEN}" \
            https://api.github.com/repos/JMartynov/mcp-vulnerabilities/dispatches \
            -d "{\"event_type\": \"upstream_fingerprints_updated\", \"client_payload\": {\"fingerprints_version\": \"${{ steps.commit_push.outputs.new_version }}\"}}" || true

  pypi-release:
    runs-on: ubuntu-latest
    needs: sync-mcp-passports
    if: needs.sync-mcp-passports.outputs.release_created == 'true'
    steps:
      - name: Verify PyPI release dispatch
        run: |
          echo "Automated PyPI release dispatched to release.yml via pypa/gh-action-pypi-publish"

  deploy-pages:
    runs-on: ubuntu-latest
    needs: sync-mcp-passports
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
