name: Daily MCP Fingerprint & Passport Sync

on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-mcp-passports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Multi-Source Passport Synchronizer
        run: |
          python -m mcp_fingerprints.cli sync --all

      - name: Validate All Passports Against Schema Invariants
        run: |
          python -m mcp_fingerprints.cli validate --dir data/fingerprints

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Compile Consolidated Snapshot
        run: |
          python -m mcp_fingerprints.snapshot data/fingerprints passports.json.gz

      - name: Commit and push updated passports & snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fingerprints/ passports.json.gz
          git diff --staged --quiet || git commit -m "chore(fingerprints): automated daily sync of MCP passports and snapshot [skip ci]"
          git push origin main
