name: Daily MCP Fingerprint & Passport Sync

on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-mcp-passports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Multi-Source Passport Synchronizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m mcp_fingerprints.cli sync --all --enrich-ast --report
          python -c "import sys; from mcp_fingerprints.reporter import generate_ecosystem_report, format_markdown_report; print(format_markdown_report(generate_ecosystem_report('data/fingerprints')))" > $GITHUB_STEP_SUMMARY

      - name: Validate All Passports Against Schema Invariants
        run: |
          python -m mcp_fingerprints.cli validate --dir data/fingerprints
          PYTHONPATH=src python scripts/validate_passports.py

      - name: Run Test Suite
        run: |
          PYTHONPATH=src pytest -v

      - name: Compile Consolidated Snapshot & Web Catalog
        run: |
          python -m mcp_fingerprints.snapshot data/fingerprints passports.json.gz
          PYTHONPATH=src:. python scripts/generate_web_catalog.py

      - name: Commit and push updated passports & snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fingerprints/ passports.json.gz web/catalog.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(fingerprints): automated daily sync of MCP passports and snapshot [skip ci]"
            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin main; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed. Retrying in $((i * 5))s..."
              sleep $((i * 5))
              git pull --rebase origin main || true
            done
            if [ "$pushed" = false ]; then
              echo "Failed to push after multiple attempts"
              exit 1
            fi
          fi
