name: Playwright E2E Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright Browsers
        run: uv run playwright install --with-deps chromium

      - name: Ruff lint (critical rules gate)
        run: uv run ruff check src tests scripts --select E9,F63,F7,F82

      - name: Guard web/catalog.json size (<50MB)
        run: |
          SIZE=$(wc -c < web/catalog.json | tr -d ' ')
          echo "web/catalog.json size: ${SIZE} bytes"
          if [ "$SIZE" -ge 52428800 ]; then
            echo "::error::web/catalog.json is ${SIZE} bytes (>=50MB GitHub limit); slim or shard the catalog"
            exit 1
          fi

      - name: Run Fast Unit Test Suite
        run: uv run pytest -v -m "not integration"

      - name: Run E2E Tests
        run: uv run pytest tests/test_web_pwa_e2e.py -v -m "integration"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 30
