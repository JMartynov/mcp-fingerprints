repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: mcp-audit-config
        name: MCP Client Configuration Auditor
        description: Audits MCP client configurations for tool collisions and security shadowing
        entry: python -m mcp_fingerprints.cli audit-config
        language: python
        types: [json]
        files: 'claude_desktop_config\.json|cursor_settings\.json|.*mcp.*\.json'
